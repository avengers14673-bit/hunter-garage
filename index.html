<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunter Garage 350</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #202020 0%, #080808 55%, #000 100%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: auto;
    padding: 25px 18px;
    position: relative;
}

/* ---------- GARAGE ENTRY ---------- */

.entry-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.small-title {
    font-size: 14px;
    letter-spacing: 5px;
    color: #aaa;
    margin-bottom: 18px;
}

.main-title {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 5px;
    line-height: 0.95;
}

.sub-title {
    margin-top: 12px;
    font-size: 18px;
    letter-spacing: 4px;
    color: #d6d6d6;
}

.entry-text {
    margin-top: 55px;
    margin-bottom: 15px;
    color: #aaa;
    font-size: 12px;
    letter-spacing: 2px;
}

.name-input {
    width: 100%;
    max-width: 310px;
    height: 52px;
    border-radius: 12px;
    border: 1px solid #444;
    background: rgba(255,255,255,0.06);
    color: white;
    text-align: center;
    outline: none;
    font-size: 16px;
}

.name-input:focus {
    border-color: #fff;
    box-shadow: 0 0 20px rgba(255,255,255,0.12);
}

.enter-btn {
    margin-top: 15px;
    width: 100%;
    max-width: 310px;
    height: 52px;
    border: none;
    border-radius: 12px;
    background: white;
    color: black;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.25s;
}

.enter-btn:active {
    transform: scale(0.96);
}

/* ---------- GARAGE ---------- */

.garage-screen {
    display: none;
    min-height: 100vh;
    animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.header {
    text-align: center;
    padding-top: 15px;
}

.header-small {
    color: #888;
    font-size: 11px;
    letter-spacing: 4px;
}

.header-title {
    margin-top: 8px;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 3px;
}

.rider {
    text-align: center;
    margin-top: 10px;
    color: #aaa;
    font-size: 12px;
    letter-spacing: 2px;
}

.bike-area {
    margin-top: 25px;
    width: 100%;
    position: relative;
}

.bike-area img {
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    display: block;
    transition: transform 0.3s ease;
}

/* ---------- TACHOMETER ---------- */

.tachometer {
    width: 285px;
    height: 285px;
    margin: 10px auto 0;
    position: relative;
    border-radius: 50%;

    background:
        radial-gradient(circle,
            #151515 0%,
            #101010 55%,
            #050505 70%,
            #000 100%);

    border: 8px solid #222;

    box-shadow:
        0 0 0 2px #555,
        0 0 25px rgba(255,255,255,0.12),
        inset 0 0 35px rgba(0,0,0,1);
}

/* outer ring */

.tachometer::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 2px solid #444;
}

/* scale */

.scale {
    position: absolute;
    inset: 20px;
    border-radius: 50%;
}

.tick {
    position: absolute;
    left: 50%;
    top: 0;
    width: 2px;
    height: 13px;
    background: #ddd;
    transform-origin: 50% 122px;
    transform: translateX(-50%) rotate(var(--angle));
}

.tick.small {
    height: 7px;
    background: #777;
}

.tick.red {
    background: #ff3030;
}

.rpm-number {
    position: absolute;
    left: 50%;
    top: 50%;
    transform:
        translate(-50%, -50%)
        rotate(var(--angle))
        translateY(-101px)
        rotate(calc(var(--angle) * -1));

    font-size: 13px;
    font-weight: 700;
    color: #ddd;
}

.rpm-number.red {
    color: #ff3434;
}

/* needle */

.needle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 103px;
    background: #f2f2f2;
    transform-origin: 50% 100%;
    transform: translate(-50%, -100%) rotate(-135deg);
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(255,255,255,0.65);
    transition: transform 0.08s linear;
    z-index: 5;
}

.needle::after {
    content: "";
    position: absolute;
    bottom: -9px;
    left: 50%;
    width: 20px;
    height: 20px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #111;
    border: 3px solid #ddd;
}

.rpm-center {
    position: absolute;
    left: 50%;
    top: 62%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 4;
}

.rpm-value {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 1px;
}

.rpm-label {
    margin-top: 3px;
    font-size: 9px;
    letter-spacing: 3px;
    color: #777;
}

.brand {
    position: absolute;
    left: 50%;
    top: 25%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 3px;
    color: #aaa;
    font-weight: bold;
}

/* ---------- ACCELERATE ---------- */

.accelerate-btn {
    width: 100%;
    height: 58px;
    margin-top: 28px;

    border: 1px solid #444;
    border-radius: 15px;

    background:
        linear-gradient(180deg, #1d1d1d, #090909);

    color: white;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 3px;

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.5),
        inset 0 1px rgba(255,255,255,0.08);

    transition: 0.2s;
}

.accelerate-btn:active {
    transform: scale(0.97);
}

.accelerate-btn.active {
    border-color: #fff;
    box-shadow:
        0 0 25px rgba(255,255,255,0.25),
        inset 0 0 20px rgba(255,255,255,0.06);
}

/* ---------- SPEED EFFECT ---------- */

.speed-line {
    position: fixed;
    width: 3px;
    height: 60px;
    background: rgba(255,255,255,0.18);
    pointer-events: none;
    opacity: 0;
}

.speeding .speed-line {
    animation: speedLines 0.45s linear infinite;
}

@keyframes speedLines {
    0% {
        transform: translateY(-100px);
        opacity: 0;
    }

    30% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(100vh);
        opacity: 0;
    }
}

.speeding .bike-area img {
    animation: bikeShake 0.08s infinite alternate;
}

@keyframes bikeShake {
    from {
        transform: translateX(-2px) scale(1.01);
    }

    to {
        transform: translateX(2px) scale(1.025);
    }
}

/* mobile */

@media (max-width: 360px) {

    .main-title {
        font-size: 40px;
    }

    .tachometer {
        width: 255px;
        height: 255px;
    }

    .tick {
        transform-origin: 50% 107px;
    }

    .rpm-number {
        transform:
            translate(-50%, -50%)
            rotate(var(--angle))
            translateY(-89px)
            rotate(calc(var(--angle) * -1));
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- ENTRY SCREEN -->

    <section class="entry-screen" id="entryScreen">

        <div class="small-title">
            PERSONAL GARAGE
        </div>

        <div class="main-title">
            HUNTER
        </div>

        <div class="sub-title">
            GARAGE 350
        </div>

        <div class="entry-text">
            ENTER YOUR NAME TO ENTER
        </div>

        <input
            id="nameInput"
            class="name-input"
            type="text"
            placeholder="YOUR NAME"
            maxlength="20"
        >

        <button class="enter-btn" onclick="enterGarage()">
            ENTER GARAGE
        </button>

    </section>


    <!-- GARAGE SCREEN -->

    <section class="garage-screen" id="garageScreen">

        <div class="header">

            <div class="header-small">
                HUNTER
            </div>

            <div class="header-title">
                GARAGE 350
            </div>

            <div class="rider">
                RIDER <span id="riderName">RIDER</span>
            </div>

        </div>


        <!-- BIKE -->

        <div class="bike-area">

            <!-- Keep your existing bike image URL here if you have one -->
            <img
                src="https://avengers14673-bit.github.io/hunter-garage/hunter.png"
                alt="Hunter 350"
                onerror="this.style.display='none';"
            >

        </div>


        <!-- PREMIUM TACHOMETER -->

        <div class="tachometer">

            <div class="brand">
                HUNTER 350
            </div>

            <div class="scale" id="scale"></div>

            <div
                class="needle"
                id="needle">
            </div>

            <div class="rpm-center">

                <div
                    class="rpm-value"
                    id="rpmValue">
                    1000
                </div>

                <div class="rpm-label">
                    RPM
                </div>

            </div>

        </div>


        <button
            class="accelerate-btn"
            id="accelerateBtn"
            onclick="accelerate()">

            ⚡ ACCELERATE

        </button>

    </section>

</div>


<script>

/* ==========================================
   CREATE RPM SCALE
========================================== */

const scale = document.getElementById("scale");

const startAngle = -135;
const endAngle = 135;

for (let i = 0; i <= 14; i++) {

    const angle =
        startAngle +
        (i / 14) * (endAngle - startAngle);

    const tick = document.createElement("div");

    tick.className = "tick";

    if (i >= 11) {
        tick.classList.add("red");
    }

    tick.style.setProperty(
        "--angle",
        angle + "deg"
    );

    scale.appendChild(tick);


    const number = document.createElement("div");

    number.className = "rpm-number";

    if (i >= 11) {
        number.classList.add("red");
    }

    number.style.setProperty(
        "--angle",
        angle + "deg"
    );

    number.textContent = i / 2;

    scale.appendChild(number);
}


/* ==========================================
   ENTER GARAGE
========================================== */

function enterGarage() {

    const input =
        document.getElementById("nameInput");

    const name =
        input.value.trim();

    document.getElementById("riderName").textContent =
        name || "RIDER";

    document.getElementById("entryScreen").style.display =
        "none";

    document.getElementById("garageScreen").style.display =
        "block";
}


/* ==========================================
   RPM CONTROL
========================================== */

const needle =
    document.getElementById("needle");

const rpmValue =
    document.getElementById("rpmValue");

const accelerateBtn =
    document.getElementById("accelerateBtn");

let currentRPM = 1000;

let animationRunning = false;


/* RPM to needle angle

   1000 RPM = -135°
   7000 RPM = +135°
*/

function rpmToAngle(rpm) {

    const minRPM = 1000;
    const maxRPM = 7000;

    const minAngle = -135;
    const maxAngle = 135;

    return minAngle +
        ((rpm - minRPM) /
        (maxRPM - minRPM)) *
        (maxAngle - minAngle);
}


/* update meter */

function updateRPM(rpm) {

    currentRPM = rpm;

    const angle =
        rpmToAngle(rpm);

    needle.style.transform =
        `translate(-50%, -100%) rotate(${angle}deg)`;

    rpmValue.textContent =
        Math.round(rpm).toLocaleString();

}


/* ==========================================
   ACCELERATION
========================================== */

function accelerate() {

    if (animationRunning) return;

    animationRunning = true;

    accelerateBtn.classList.add("active");

    document.body.classList.add("speeding");

    let startTime = null;

    const duration = 2600;

    function animateAcceleration(timestamp) {

        if (!startTime) {
            startTime = timestamp;
        }

        const elapsed =
            timestamp - startTime;

        const progress =
            Math.min(elapsed / duration, 1);

        /* smooth acceleration */

        const eased =
            1 - Math.pow(1 - progress, 3);

        const rpm =
            1000 +
            eased * 6000;

        updateRPM(rpm);

        if (progress < 1) {

            requestAnimationFrame(
                animateAcceleration
            );

        } else {

            setTimeout(() => {

                decelerate();

            }, 500);
        }
    }

    requestAnimationFrame(
        animateAcceleration
    );
}


/* ==========================================
   DECELERATION
========================================== */

function decelerate() {

    let startRPM = currentRPM;

    let startTime = null;

    const duration = 1800;

    function animate(timestamp) {

        if (!startTime) {
            startTime = timestamp;
        }

        const progress =
            Math.min(
                (timestamp - startTime) /
                duration,
                1
            );

        const eased =
            1 - Math.pow(1 - progress, 2);

        const rpm =
            startRPM -
            eased * (startRPM - 1000);

        updateRPM(rpm);

        if (progress < 1) {

            requestAnimationFrame(animate);

        } else {

            updateRPM(1000);

            accelerateBtn.classList.remove(
                "active"
            );

            document.body.classList.remove(
                "speeding"
            );

            animationRunning = false;
        }
    }

    requestAnimationFrame(animate);
}


/* ==========================================
   KEYBOARD SUPPORT
========================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Enter" &&
            document.getElementById(
                "entryScreen"
            ).style.display !== "none"
        ) {

            enterGarage();

        }

        if (
            event.code === "Space" &&
            document.getElementById(
                "garageScreen"
            ).style.display === "block"
        ) {

            event.preventDefault();

            accelerate();
        }
    }
);


/* initial RPM */

updateRPM(1000);

</script>

</body>
</html>
