<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunter Garage 350</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#02050a;
    color:white;
}

body{
    touch-action:manipulation;
}

/* =========================
   ENTRY SCREEN
========================= */

.entry{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 35%,rgba(0,120,255,.18),transparent 35%),
        linear-gradient(145deg,#02050a,#07111e 55%,#010307);
    z-index:10;
}

.entry-box{
    width:90%;
    max-width:430px;
    text-align:center;
}

.small-title{
    font-size:12px;
    letter-spacing:5px;
    color:#7ebeff;
    margin-bottom:18px;
}

.main-title{
    font-size:52px;
    font-weight:900;
    letter-spacing:5px;
    line-height:.9;
}

.main-title span{
    display:block;
    font-size:24px;
    letter-spacing:8px;
    color:#8fb9e8;
    margin-top:12px;
}

.entry-sub{
    margin:28px 0 18px;
    font-size:13px;
    letter-spacing:2px;
    color:#9aa9bb;
}

.name-input{
    width:100%;
    height:55px;
    border:1px solid rgba(80,160,255,.35);
    border-radius:12px;
    background:rgba(5,15,28,.8);
    color:white;
    text-align:center;
    font-size:17px;
    outline:none;
}

.name-input:focus{
    border-color:#168cff;
    box-shadow:0 0 20px rgba(0,130,255,.18);
}

.enter-btn{
    width:100%;
    height:55px;
    margin-top:14px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#0757a8,#0d8cff);
    color:white;
    font-size:14px;
    font-weight:bold;
    letter-spacing:3px;
    cursor:pointer;
    box-shadow:0 8px 30px rgba(0,120,255,.25);
}

/* =========================
   GARAGE
========================= */

.garage{
    position:fixed;
    inset:0;
    display:none;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 25%,rgba(0,120,255,.15),transparent 35%),
        linear-gradient(180deg,#02060b 0%,#07111d 55%,#020407 100%);
}

.garage.active{
    display:block;
}

/* Garage lights */

.ceiling-lights{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:90px;
    display:flex;
    justify-content:space-around;
    opacity:.7;
}

.ceiling-lights span{
    width:2px;
    height:100%;
    background:linear-gradient(to bottom,
        transparent,
        rgba(80,170,255,.75),
        transparent
    );
    box-shadow:0 0 18px rgba(40,150,255,.5);
}

/* Floor */

.floor{
    position:absolute;
    left:-10%;
    bottom:-20%;
    width:120%;
    height:55%;
    transform:perspective(500px) rotateX(60deg);
    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.025) 0,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 70px
        ),
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.02) 0,
            rgba(255,255,255,.02) 1px,
            transparent 1px,
            transparent 55px
        );
}

/* Header */

.garage-header{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    z-index:5;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:14px;
    font-weight:900;
    letter-spacing:3px;
}

.logo span{
    display:block;
    font-size:9px;
    letter-spacing:4px;
    color:#55aaff;
    margin-top:4px;
}

.rider{
    text-align:right;
    font-size:9px;
    letter-spacing:2px;
    color:#6f89a5;
}

.rider strong{
    display:block;
    color:white;
    font-size:13px;
    letter-spacing:2px;
    margin-top:4px;
}

/* =========================
   REAL BIKE PHOTO
========================= */

.bike-stage{
    position:absolute;
    top:41%;
    left:50%;
    width:100vw;
    height:430px;
    transform:translate(-50%,-50%);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.bike-photo{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 72%;
    transform:scale(1.18);
    filter:brightness(.82) contrast(1.08) saturate(1.05);
    user-select:none;
    -webkit-user-drag:none;
}

/* Cinematic overlay */

.bike-stage::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            to bottom,
            rgba(2,6,11,.8) 0%,
            transparent 25%,
            transparent 65%,
            rgba(2,5,9,.92) 100%
        );
}

/* Bike vibration ONLY */

.bike-stage.revving .bike-photo{
    animation:engineShake .09s infinite;
}

@keyframes engineShake{
    0%{
        transform:scale(1.18) translate(0,0);
    }
    25%{
        transform:scale(1.18) translate(-1px,1px);
    }
    50%{
        transform:scale(1.18) translate(1px,-1px);
    }
    75%{
        transform:scale(1.18) translate(-1px,0);
    }
    100%{
        transform:scale(1.18) translate(0,0);
    }
}

/* =========================
   CONTROLS
========================= */

.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:25px;
    z-index:8;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

.rpm{
    font-size:12px;
    letter-spacing:3px;
    color:#91a9c3;
}

.rpm strong{
    color:white;
    font-size:18px;
}

.accelerator{
    width:230px;
    height:62px;
    border:none;
    border-radius:18px;
    background:
        linear-gradient(135deg,#0758a8,#0b8fff);
    color:white;
    font-size:15px;
    font-weight:900;
    letter-spacing:3px;
    box-shadow:
        0 8px 30px rgba(0,120,255,.35),
        inset 0 1px rgba(255,255,255,.25);
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

.accelerator:active{
    transform:scale(.97);
    box-shadow:
        0 3px 15px rgba(0,120,255,.5),
        inset 0 2px rgba(0,0,0,.2);
}

.status{
    font-size:9px;
    letter-spacing:2px;
    color:#6e849b;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .main-title{
        font-size:44px;
    }

    .main-title span{
        font-size:20px;
    }

    .garage-header{
        top:15px;
        left:16px;
        right:16px;
    }

    .bike-stage{
        top:39%;
        height:360px;
    }

    .bike-photo{
        transform:scale(.95);
        object-position:50% 73%;
    }

    .bike-stage.revving .bike-photo{
        animation:engineShakeMobile .09s infinite;
    }

    @keyframes engineShakeMobile{
        0%{
            transform:scale(1.28) translate(0,0);
        }
        25%{
            transform:scale(1.28) translate(-1px,1px);
        }
        50%{
            transform:scale(1.28) translate(1px,-1px);
        }
        75%{
            transform:scale(1.28) translate(-1px,0);
        }
        100%{
            transform:scale(1.28) translate(0,0);
        }
    }

    .controls{
        bottom:21px;
    }

    .accelerator{
        width:235px;
        height:64px;
        font-size:14px;
    }
}
</style>
</head>

<body>

<!-- =========================
     ENTRY
========================= -->

<section class="entry" id="entry">

    <div class="entry-box">

        <div class="small-title">
            PERSONAL GARAGE
        </div>

        <div class="main-title">
            HUNTER
            <span>GARAGE 350</span>
        </div>

        <div class="entry-sub">
            ENTER YOUR NAME TO ENTER
        </div>

        <input
            type="text"
            id="nameInput"
            class="name-input"
            placeholder="Your Name"
            maxlength="18"
            autocomplete="off"
        >

        <button
            class="enter-btn"
            id="enterBtn">
            ENTER GARAGE
        </button>

    </div>

</section>


<!-- =========================
     GARAGE
========================= -->

<section class="garage" id="garage">

    <div class="ceiling-lights">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="floor"></div>

    <header class="garage-header">

        <div class="logo">
            HUNTER
            <span>GARAGE 350</span>
        </div>

        <div class="rider">
            RIDER
            <strong id="riderName">RIDER</strong>
        </div>

    </header>


    <!-- REAL HUNTER 350 PHOTO -->

    <div class="bike-stage" id="bikeStage">

        <img
            src="hunter350.jpg"
            alt="Hunter 350"
            class="bike-photo"
            draggable="false"
        >

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <div class="rpm">
            ENGINE
            <strong id="rpmValue">1000 RPM</strong>
        </div>

        <button
            class="accelerator"
            id="accelerator">
            ⚡ ACCELERATE
        </button>

        <div class="status" id="status">
            ENGINE IDLE
        </div>

    </div>

</section>


<!-- =========================
     ENGINE SOUND
========================= -->

<audio
    id="engineSound"
    src="engine.mp3"
    preload="auto"
    loop>
</audio>


<script>

const entry = document.getElementById("entry");
const garage = document.getElementById("garage");

const nameInput = document.getElementById("nameInput");
const enterBtn = document.getElementById("enterBtn");

const riderName = document.getElementById("riderName");

const accelerator = document.getElementById("accelerator");
const bikeStage = document.getElementById("bikeStage");

const rpmValue = document.getElementById("rpmValue");
const statusText = document.getElementById("status");

const engineSound = document.getElementById("engineSound");


/* =========================
   ENTER GARAGE
========================= */

function enterGarage(){

    let name = nameInput.value.trim();

    if(name === ""){
        name = "RIDER";
    }

    riderName.textContent = name.toUpperCase();

    entry.style.display = "none";
    garage.classList.add("active");
}


/* Button */

enterBtn.addEventListener("click", enterGarage);


/* Enter key */

nameInput.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        enterGarage();
    }

});


/* =========================
   ENGINE SOUND
========================= */

let revving = false;


/*
   Start engine
*/

function startEngine(){

    if(revving) return;

    revving = true;

    bikeStage.classList.add("revving");

    statusText.textContent = "ENGINE REVVING";
    rpmValue.textContent = "7000 RPM";


    /*
       Browser autoplay rules require
       the sound to start from a user gesture.
    */

    engineSound.currentTime = 0;

    engineSound.volume = 1.0;

    const playPromise = engineSound.play();

    if(playPromise !== undefined){

        playPromise.catch(function(error){

            console.log("Audio could not start:", error);

        });

    }

}


/*
   Stop engine
*/

function stopEngine(){

    if(!revving) return;

    revving = false;

    bikeStage.classList.remove("revving");

    statusText.textContent = "ENGINE IDLE";
    rpmValue.textContent = "1000 RPM";


    /*
       Stop sound
    */

    engineSound.pause();
    engineSound.currentTime = 0;

}


/* =========================
   TOUCH / MOBILE
========================= */

accelerator.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        startEngine();

    }
);


accelerator.addEventListener(
    "pointerup",
    function(e){

        e.preventDefault();

        stopEngine();

    }
);


accelerator.addEventListener(
    "pointercancel",
    function(){

        stopEngine();

    }
);


accelerator.addEventListener(
    "pointerleave",
    function(){

        /*
           Only stop when the pointer
           actually leaves while pressing.
        */

        if(revving){
            stopEngine();
        }

    }
);


/* =========================
   SAFETY
========================= */

window.addEventListener(
    "blur",
    function(){

        stopEngine();

    }
);

</script>

</body>
</html>
