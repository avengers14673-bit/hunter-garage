<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#030711">

<title>Hunter Garage 350</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02050a;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    touch-action:manipulation;
}


/* =====================================================
   ENTRY SCREEN
===================================================== */

.entry{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(0,105,220,.20),
            transparent 42%
        ),
        linear-gradient(
            145deg,
            #02040a,
            #07111f 55%,
            #02050a
        );

    transition:
        opacity .7s ease,
        visibility .7s ease;
}

.entry.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.entry-card{
    width:min(420px,92vw);

    padding:40px 24px;

    text-align:center;

    border-radius:24px;

    border:1px solid
        rgba(80,170,255,.22);

    background:
        rgba(4,11,22,.78);

    backdrop-filter:blur(18px);

    box-shadow:
        0 30px 90px rgba(0,0,0,.7),
        inset 0 0 40px
        rgba(30,120,255,.04);
}

.small-logo{
    color:#69b8ff;

    font-size:11px;

    letter-spacing:5px;

    margin-bottom:16px;
}

.entry-title{
    font-size:
        clamp(42px,12vw,68px);

    font-weight:900;

    letter-spacing:3px;

    line-height:.9;
}

.entry-subtitle{
    margin-top:13px;

    font-size:14px;

    color:#9eafc3;

    letter-spacing:7px;
}

.entry-description{
    margin-top:30px;

    font-size:10px;

    color:#73849a;

    letter-spacing:2.5px;
}

.name-input{
    width:100%;

    height:55px;

    margin-top:15px;

    padding:0 16px;

    border-radius:13px;

    border:1px solid
        rgba(90,175,255,.30);

    outline:none;

    background:
        rgba(0,0,0,.42);

    color:white;

    text-align:center;

    font-size:16px;

    letter-spacing:2px;

    text-transform:uppercase;
}

.name-input:focus{
    border-color:#3198ff;

    box-shadow:
        0 0 22px
        rgba(30,130,255,.20);
}

.name-input::placeholder{
    color:#63748a;
}

.enter-button{
    width:100%;

    height:55px;

    margin-top:13px;

    border:none;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #168bff,
            #0646a0
        );

    color:white;

    font-size:12px;

    font-weight:900;

    letter-spacing:3px;

    cursor:pointer;

    box-shadow:
        0 12px 35px
        rgba(0,100,255,.28);
}

.enter-button:active{
    transform:scale(.97);
}


/* =====================================================
   GARAGE
===================================================== */

.garage{
    position:fixed;
    inset:0;

    overflow:hidden;

    opacity:0;
    visibility:hidden;

    background:
        radial-gradient(
            ellipse at 50% 40%,
            rgba(10,85,160,.20),
            transparent 48%
        ),
        linear-gradient(
            180deg,
            #030711 0%,
            #06101c 50%,
            #010409 100%
        );

    transition:
        opacity .8s ease;
}

.garage.show{
    opacity:1;
    visibility:visible;
}


/* =====================================================
   GARAGE WALL
===================================================== */

.wall-lines{
    position:absolute;
    inset:0;

    opacity:.35;

    background:
        linear-gradient(
            90deg,
            transparent 0 10%,
            rgba(100,160,210,.035) 10.2% 10.4%,
            transparent 10.6% 89.4%,
            rgba(100,160,210,.035) 89.6% 89.8%,
            transparent 90%
        );

    pointer-events:none;
}

.light-row{
    position:absolute;

    top:9%;

    left:5%;
    right:5%;

    display:flex;

    justify-content:space-between;

    opacity:.65;
}

.light{
    width:14%;

    height:3px;

    background:#cce8ff;

    box-shadow:
        0 0 10px #65b8ff,
        0 0 30px rgba(40,140,255,.7);
}


/* =====================================================
   FLOOR
===================================================== */

.floor{
    position:absolute;

    left:-15%;
    bottom:-15%;

    width:130%;
    height:43%;

    transform:
        perspective(500px)
        rotateX(58deg);

    transform-origin:bottom;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 70px,
            rgba(50,130,220,.045) 71px,
            transparent 73px
        ),
        linear-gradient(
            180deg,
            rgba(10,25,42,.55),
            rgba(0,3,8,.98)
        );

    border-top:
        1px solid
        rgba(80,160,230,.13);
}


/* =====================================================
   HEADER
===================================================== */

.header{
    position:absolute;

    top:17px;
    left:18px;
    right:18px;

    z-index:20;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.logo{
    font-size:12px;

    font-weight:900;

    letter-spacing:4px;
}

.logo span{
    color:#3da6ff;
}

.rider{
    text-align:right;

    color:#73869d;

    font-size:8px;

    letter-spacing:2px;
}

.rider strong{
    display:block;

    margin-top:3px;

    color:white;

    font-size:11px;

    letter-spacing:2px;
}


/* =====================================================
   BIKE DISPLAY
===================================================== */

.bike-stage{
    position:absolute;

    left:50%;
    top:41%;

    width:100vw;
    height:430px;

    transform:
        translate(-50%,-50%);

    z-index:5;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:visible;
}


/*
   Large cinematic glow behind bike.
*/

.bike-glow{
    position:absolute;

    left:50%;
    bottom:25px;

    width:82vw;
    height:130px;

    transform:
        translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(0,105,255,.25),
            transparent 70%
        );

    filter:blur(18px);

    pointer-events:none;
}


/*
   PHOTO FRAME

   The uploaded image itself is used here.
*/

.photo-container{
    position:relative;

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:24px;
}


/*
   REAL HUNTER PHOTO
*/

.bike-photo{
    width:100%;
    height:100%;

    object-fit:cover;

    /*
      This crops some empty sky and black
      borders while keeping the motorcycle
      large and visible.
    */

    object-position:
        50% 72%;

    transform:
        scale(1.18);

    display:block;

    user-select:none;

    -webkit-user-drag:none;

    pointer-events:none;

    filter:
        saturate(1.05)
        contrast(1.04)
        brightness(.82)
        drop-shadow(
            0 25px 25px
            rgba(0,0,0,.8)
        );

    transform-origin:center center;

    transition:
        filter .2s ease;
}


/*
   Cinematic dark gradient over photo.
*/

.photo-overlay{
    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            180deg,
            rgba(2,6,13,.68),
            transparent 28%,
            transparent 60%,
            rgba(1,5,10,.65)
        ),
        linear-gradient(
            90deg,
            rgba(2,7,14,.28),
            transparent 35%,
            transparent 65%,
            rgba(2,7,14,.25)
        );
}


/*
   BLUE FLOOR REFLECTION
*/

.reflection{
    position:absolute;

    left:50%;
    bottom:24px;

    width:70%;

    height:35px;

    transform:
        translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(20,130,255,.32),
            transparent 70%
        );

    filter:blur(12px);

    pointer-events:none;
}


/* =====================================================
   ACCELERATION EFFECT
===================================================== */

.bike-stage.revving
.bike-photo{

    /*
      IMPORTANT:
      Animation is on the IMAGE itself.
      The stage positioning never changes.
    */

    animation:
        engineShake .075s infinite;

    filter:
        saturate(1.10)
        contrast(1.08)
        brightness(1.02)
        drop-shadow(
            0 25px 25px
            rgba(0,0,0,.85)
        )
        drop-shadow(
            0 0 25px
            rgba(0,115,255,.25)
        );
}

@keyframes engineShake{

    0%{
        transform:
            scale(1.18)
            translateY(0)
            rotate(0deg);
    }

    25%{
        transform:
            scale(1.18)
            translateY(1px)
            rotate(.12deg);
    }

    50%{
        transform:
            scale(1.18)
            translateY(-1px)
            rotate(-.12deg);
    }

    75%{
        transform:
            scale(1.18)
            translateY(1px)
            rotate(.08deg);
    }

    100%{
        transform:
            scale(1.18)
            translateY(0)
            rotate(0deg);
    }
}


/* =====================================================
   ENGINE LIGHT
===================================================== */

.engine-light{
    position:absolute;

    left:50%;
    bottom:65px;

    width:70px;
    height:30px;

    transform:
        translateX(-50%);

    border-radius:50%;

    background:
        rgba(0,120,255,0);

    filter:blur(16px);

    pointer-events:none;
}

.garage.running
.engine-light{

    background:
        rgba(0,125,255,.32);

    animation:
        lightPulse .18s infinite alternate;
}

@keyframes lightPulse{

    from{
        opacity:.35;
        transform:
            translateX(-50%)
            scale(.8);
    }

    to{
        opacity:1;
        transform:
            translateX(-50%)
            scale(1.25);
    }
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{
    position:absolute;

    z-index:30;

    left:50%;

    /*
      Button is intentionally raised
      from the extreme bottom.
    */

    bottom:25px;

    transform:
        translateX(-50%);

    width:min(390px,90vw);

    display:flex;

    flex-direction:column;

    align-items:center;
}


/* RPM */

.rpm{
    padding:7px 20px;

    margin-bottom:9px;

    border:
        1px solid
        rgba(90,170,255,.18);

    border-radius:20px;

    background:
        rgba(2,8,16,.78);

    backdrop-filter:
        blur(12px);

    color:#7c91aa;

    font-size:9px;

    letter-spacing:2px;
}

.rpm strong{
    color:white;

    font-size:15px;

    margin-left:5px;
}


/* =====================================================
   ACCELERATOR
===================================================== */

.accelerator{

    width:min(340px,88vw);

    height:64px;

    border-radius:18px;

    border:
        1px solid
        rgba(90,185,255,.58);

    background:
        linear-gradient(
            135deg,
            #126fc9,
            #052d60
        );

    color:white;

    font-size:14px;

    font-weight:900;

    letter-spacing:3px;

    cursor:pointer;

    touch-action:none;

    user-select:none;

    box-shadow:
        0 12px 35px
        rgba(0,80,180,.38),

        inset 0 1px 0
        rgba(255,255,255,.12);

    transition:
        transform .1s ease,
        box-shadow .1s ease,
        background .1s ease;
}

.accelerator span{
    font-size:19px;

    margin-right:5px;
}

.accelerator.pressed{

    transform:
        scale(.96);

    background:
        linear-gradient(
            135deg,
            #159cff,
            #0752b8
        );

    box-shadow:
        0 0 30px
        rgba(20,145,255,.7),

        0 10px 35px
        rgba(0,100,255,.45);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{
        top:14px;
        left:15px;
        right:15px;
    }

    .logo{
        font-size:10px;
        letter-spacing:3px;
    }

    .rider{
        font-size:7px;
    }

    .rider strong{
        font-size:10px;
    }


    /*
       REAL BIKE PHOTO IS MOVED UP.
    */

    .bike-stage{

        top:39%;

        width:100vw;

        height:360px;
    }


    .photo-container{

        border-radius:18px;
    }


    .bike-photo{

        transform:
            scale(1.28);

        object-position:
            50% 73%;
    }


    .bike-stage.revving
    .bike-photo{

        animation:
            engineShakeMobile .075s infinite;
    }

    @keyframes engineShakeMobile{

        0%,100%{
            transform:
                scale(1.28)
                translateY(0)
                rotate(0);
        }

        25%{
            transform:
                scale(1.28)
                translateY(1px)
                rotate(.12deg);
        }

        50%{
            transform:
                scale(1.28)
                translateY(-1px)
                rotate(-.12deg);
        }

        75%{
            transform:
                scale(1.28)
                translateY(1px)
                rotate(.08deg);
        }
    }


    /*
       Accelerator raised and easy
       for the thumb to reach.
    */

    .controls{

        bottom:21px;

        width:90vw;
    }

    .rpm{

        margin-bottom:8px;

        padding:6px 17px;
    }

    .accelerator{

        width:min(345px,90vw);

        height:63px;

        border-radius:17px;
    }
}


/* =====================================================
   SMALL HEIGHT PHONES
===================================================== */

@media(max-height:700px){

    .bike-stage{

        top:36%;

        height:315px;
    }

    .bike-photo{

        transform:
            scale(1.18);

        object-position:
            50% 73%;
    }

    .controls{

        bottom:12px;
    }

    .accelerator{

        height:58px;
    }

    .rpm{

        margin-bottom:5px;
    }
}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:800px){

    .bike-stage{

        width:min(950px,95vw);

        height:500px;

        top:44%;
    }

    .bike-photo{

        transform:
            scale(1.15);

        object-position:
            50% 73%;
    }

    .controls{

        bottom:28px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     ENTRY SCREEN
===================================================== -->

<section
    id="entry"
    class="entry">

    <div class="entry-card">

        <div class="small-logo">
            PERSONAL GARAGE
        </div>

        <div class="entry-title">
            HUNTER
        </div>

        <div class="entry-subtitle">
            GARAGE 350
        </div>

        <div class="entry-description">
            ENTER YOUR NAME TO ENTER
        </div>

        <input
            id="nameInput"
            class="name-input"
            type="text"
            maxlength="18"
            autocomplete="off"
            placeholder="YOUR NAME"
        >

        <button
            id="enterButton"
            class="enter-button">

            ENTER GARAGE

        </button>

    </div>

</section>



<!-- =====================================================
     GARAGE
===================================================== -->

<section
    id="garage"
    class="garage">

    <div class="wall-lines"></div>


    <div class="light-row">

        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>

    </div>


    <div class="floor"></div>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            HUNTER
            <span>GARAGE 350</span>

        </div>

        <div class="rider">

            RIDER

            <strong id="riderName">
                RIDER
            </strong>

        </div>

    </header>



    <!-- =================================================
         REAL BIKE
    ================================================= -->

    <main
        id="bikeStage"
        class="bike-stage">

        <div class="bike-glow"></div>


        <div class="photo-container">

            <!--
              YOUR UPLOADED PHOTO

              GitHub file name MUST be:

              hunter350.jpg
            -->

            <img
                id="bikePhoto"
                class="bike-photo"
                src="hunter350.jpg"
                alt="Hunter 350"
                draggable="false"
            >


            <div class="photo-overlay"></div>

        </div>


        <div class="reflection"></div>

        <div class="engine-light"></div>

    </main>



    <!-- =================================================
         CONTROLS
    ================================================= -->

    <div class="controls">

        <div class="rpm">

            ENGINE

            <strong id="rpm">
                1000 RPM
            </strong>

        </div>


        <button
            id="accelerator"
            class="accelerator"
            type="button">

            <span>⚡</span>

            ACCELERATE

        </button>

    </div>

</section>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const entry =
    document.getElementById("entry");

const garage =
    document.getElementById("garage");

const nameInput =
    document.getElementById("nameInput");

const enterButton =
    document.getElementById("enterButton");

const riderName =
    document.getElementById("riderName");

const bikeStage =
    document.getElementById("bikeStage");

const bikePhoto =
    document.getElementById("bikePhoto");

const accelerator =
    document.getElementById("accelerator");

const rpm =
    document.getElementById("rpm");


/* =====================================================
   ENTER GARAGE
===================================================== */

function enterGarage(){

    let name =
        nameInput.value.trim();

    if(name === ""){
        name = "RIDER";
    }

    name =
        name
        .substring(0,18)
        .toUpperCase();

    riderName.textContent =
        name;

    entry.classList.add("hide");

    setTimeout(()=>{

        garage.classList.add("show");

    },300);
}


enterButton.addEventListener(
    "click",
    enterGarage
);


nameInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            enterGarage();

        }

    }
);


/* =====================================================
   ENGINE
===================================================== */

let audioContext = null;

let oscillator = null;

let gainNode = null;

let accelerating = false;

let currentRPM = 1000;

let targetRPM = 1000;


/* =====================================================
   CREATE ENGINE AUDIO
===================================================== */

function createEngine(){

    if(audioContext){
        return;
    }

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    oscillator =
        audioContext.createOscillator();

    gainNode =
        audioContext.createGain();


    oscillator.type =
        "sawtooth";


    oscillator.frequency.value =
        55;


    gainNode.gain.value =
        0.0001;


    oscillator.connect(
        gainNode
    );

    gainNode.connect(
        audioContext.destination
    );


    oscillator.start();
}


/* =====================================================
   START REV
===================================================== */

function startEngine(){

    if(accelerating){
        return;
    }

    accelerating = true;

    targetRPM = 7200;


    accelerator.classList.add(
        "pressed"
    );


    bikeStage.classList.add(
        "revving"
    );


    garage.classList.add(
        "running"
    );


    createEngine();


    if(
        audioContext &&
        audioContext.state === "suspended"
    ){

        audioContext.resume();

    }


    if(gainNode){

        gainNode.gain.cancelScheduledValues(
            audioContext.currentTime
        );

        gainNode.gain.setTargetAtTime(
            0.045,
            audioContext.currentTime,
            .035
        );

    }

}


/* =====================================================
   STOP REV
===================================================== */

function stopEngine(){

    if(!accelerating){
        return;
    }

    accelerating = false;

    targetRPM = 1000;


    accelerator.classList.remove(
        "pressed"
    );


    bikeStage.classList.remove(
        "revving"
    );


    garage.classList.remove(
        "running"
    );


    if(gainNode){

        gainNode.gain.cancelScheduledValues(
            audioContext.currentTime
        );

        gainNode.gain.setTargetAtTime(
            0.0001,
            audioContext.currentTime,
            .08
        );

    }

}


/* =====================================================
   RPM LOOP
===================================================== */

function updateRPM(){

    if(currentRPM < targetRPM){

        currentRPM +=
            (targetRPM-currentRPM)
            * .14;

    }


    if(currentRPM > targetRPM){

        currentRPM -=
            (currentRPM-targetRPM)
            * .12;

    }


    currentRPM =
        Math.round(currentRPM / 10) * 10;


    rpm.textContent =
        currentRPM.toLocaleString()
        + " RPM";


    if(oscillator){

        oscillator.frequency.value =
            45 +
            currentRPM / 48;

    }


    requestAnimationFrame(
        updateRPM
    );
}


updateRPM();


/* =====================================================
   ACCELERATOR
===================================================== */

accelerator.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

        startEngine();

    },
    {passive:false}
);


/*
   Release finger anywhere.
*/

window.addEventListener(
    "pointerup",
    function(){

        stopEngine();

    }
);


window.addEventListener(
    "pointercancel",
    function(){

        stopEngine();

    }
);


/*
   Prevent long-press menu.
*/

accelerator.addEventListener(
    "contextmenu",
    function(event){

        event.preventDefault();

    }
);


/* =====================================================
   IMAGE CHECK
===================================================== */

bikePhoto.addEventListener(
    "error",
    function(){

        console.log(
            "hunter350.jpg not found."
        );

    }
);

</script>

</body>
</html>
